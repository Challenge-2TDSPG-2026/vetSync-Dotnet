version: "3.8"

services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: vetclinic-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Defina ORACLE_PASSWORD no arquivo .env}
      ORACLE_DATABASE: VETDB
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  mongo:
    image: mongo:7
    container_name: vetclinic-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vetclinic-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__OracleConnection=User Id=system;Password=${ORACLE_PASSWORD};Data Source=oracle:1521/XEPDB1;
      - Mongo__ConnectionString=mongodb://mongo:27017
      - Mongo__Database=vetsync
      # Troque a chave em qualquer ambiente real (mínimo 32 caracteres)
      - Jwt__Key=${JWT_KEY:?Defina JWT_KEY no arquivo .env}
    depends_on:
      oracle:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: on-failure

volumes:
  oracle-data:
  mongo-data:
