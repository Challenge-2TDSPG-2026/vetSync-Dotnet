<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VetSync — Clínicas Veterinárias Próximas</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 20px;
    color: #1f2937;
    background: #f9fafb;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.subtitle { color: #6b7280; margin-top: 0; margin-bottom: 24px; }
  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #374151; }
  input[type="number"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  button {
    background: #0f6e56;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #085041; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  #status { margin-top: 12px; font-size: 13px; color: #6b7280; }
  #status.erro { color: #b91c1c; }
  #resultados { margin-top: 8px; }
  .clinica {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
    background: #fff;
  }
  .clinica .nome { font-weight: 600; font-size: 15px; }
  .clinica .distancia { color: #0f6e56; font-weight: 600; font-size: 13px; }
  .clinica .endereco { color: #6b7280; font-size: 13px; margin-top: 2px; }
  .clinica .fonte { color: #9ca3af; font-size: 11px; margin-top: 6px; }
  .vazio { color: #6b7280; font-size: 14px; padding: 12px 0; }
</style>
</head>
<body>

  <h1>🐾 Clínicas veterinárias perto de você</h1>
  <p class="subtitle">
    Esta página pede a <strong>sua localização real</strong> ao navegador e busca
    clínicas veterinárias reais (OpenStreetMap) próximas a você.
  </p>

  <div class="card">
    <label for="raio">Raio de busca (km)</label>
    <input type="number" id="raio" value="10" min="1" max="100" step="1" />

    <button id="btnLocalizar" onclick="usarLocalizacaoReal()">
      📍 Usar minha localização e buscar clínicas
    </button>

    <div id="status"></div>
  </div>

  <div id="resultados"></div>

  <script>
    const statusEl = document.getElementById('status');
    const resultadosEl = document.getElementById('resultados');
    const btn = document.getElementById('btnLocalizar');

    function usarLocalizacaoReal() {
      if (!('geolocation' in navigator)) {
        mostrarErro('Seu navegador não suporta geolocalização.');
        return;
      }

      btn.disabled = true;
      statusEl.className = '';
      statusEl.textContent = 'Solicitando permissão de localização ao navegador...';
      resultadosEl.innerHTML = '';

      navigator.geolocation.getCurrentPosition(
        onLocalizacaoObtida,
        onErroLocalizacao,
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    async function onLocalizacaoObtida(position) {
      const { latitude, longitude } = position.coords;
      const raioKm = document.getElementById('raio').value || 10;

      statusEl.textContent =
        `Localização obtida: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}. ` +
        `Buscando clínicas reais num raio de ${raioKm}km...`;

      try {
        const url = `/api/clinicas/proximas?latitude=${latitude}&longitude=${longitude}&raioKm=${raioKm}`;
        const resposta = await fetch(url);

        if (!resposta.ok) {
          const erro = await resposta.json().catch(() => ({}));
          throw new Error(erro.message || `Erro ${resposta.status} ao consultar a API.`);
        }

        const clinicas = await resposta.json();
        renderizarResultados(clinicas, latitude, longitude);
      } catch (err) {
        mostrarErro(err.message || 'Falha ao consultar a API.');
      } finally {
        btn.disabled = false;
      }
    }

    function onErroLocalizacao(err) {
      btn.disabled = false;
      const mensagens = {
        1: 'Permissão de localização negada. Habilite o acesso à localização para este site.',
        2: 'Não foi possível determinar sua localização no momento.',
        3: 'Tempo esgotado ao tentar obter sua localização.'
      };
      mostrarErro(mensagens[err.code] || 'Erro desconhecido ao obter localização.');
    }

    function mostrarErro(mensagem) {
      statusEl.className = 'erro';
      statusEl.textContent = mensagem;
    }

    function renderizarResultados(clinicas, latUsuario, lonUsuario) {
      statusEl.className = '';
      statusEl.textContent =
        `${clinicas.length} clínica(s) real(is) encontrada(s) via OpenStreetMap.`;

      if (clinicas.length === 0) {
        resultadosEl.innerHTML = '<p class="vazio">Nenhuma clínica veterinária encontrada nesse raio. Tente aumentar o raio de busca.</p>';
        return;
      }

      resultadosEl.innerHTML = clinicas.map(c => `
        <div class="clinica">
          <div class="nome">${escapeHtml(c.nome)} <span class="distancia">— ${c.distanciaKm} km</span></div>
          ${c.endereco ? `<div class="endereco">${escapeHtml(c.endereco)}</div>` : ''}
          ${c.telefone ? `<div class="endereco">📞 ${escapeHtml(c.telefone)}</div>` : ''}
          <div class="fonte">Fonte: ${escapeHtml(c.fonte)} · lat ${c.latitude.toFixed(5)}, lon ${c.longitude.toFixed(5)}</div>
        </div>
      `).join('');
    }

    function escapeHtml(texto) {
      const div = document.createElement('div');
      div.textContent = texto ?? '';
      return div.innerHTML;
    }
  </script>

</body>
</html>
